name: Build check

on:
  push:
  pull_request:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site from SYLLABUS.md
        run: python3 build.py
      - name: Fail if generated pages are stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated HTML is out of date. Run 'python3 build.py' and commit the result."
            exit 1
          fi
      - name: Validate HTML (W3C Nu validator)
        run: |
          curl -sL -o /tmp/vnu.jar https://github.com/validator/validator/releases/download/latest/vnu.jar
          java -jar /tmp/vnu.jar index.html method.html resources.html units/*.html
