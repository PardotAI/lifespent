<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LifeSpent share image (render template)</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;900&family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fff;border-top:14px solid #a3302f;font-family:"Inter Tight",sans-serif;color:#1d2b33;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:18px;font-weight:900;font-size:34px;letter-spacing:-.02em}
.mark{width:58px;height:58px;border-radius:50%;background:#a3302f;display:grid;place-items:center}.mark svg{width:30px;height:30px}
h1{font-weight:900;font-size:96px;line-height:1;letter-spacing:-.04em;margin:0}
.accent{color:#a3302f}
.bar{display:flex;gap:6px;width:420px}.bar i{flex:1;height:8px}
.foot{display:flex;justify-content:space-between;font-family:Inter,sans-serif;font-weight:500;font-size:26px;color:#4a5a63}
.foot b{color:#a3302f}
.lsw{font-weight:900;font-size:44px;letter-spacing:-.04em;padding-bottom:6px;border-bottom:5px solid #a3302f}.lsw span{color:#a3302f}.crs{font-weight:600;font-size:28px;color:#48525b;padding-left:20px;border-left:2px solid #e4e2dd;margin-left:6px}
</style>
  </head>
  <body>
    <div class="top"><span class="lsw">Life<span>Spent</span></span><span class="crs">Biblical Apologetics</span></div>
    <h1>Learn how Scripture<br><span class="accent">defends itself.</span></h1>
    <div class="bar"><i style="background:#a3302f"></i><i style="background:#a3302f"></i><i style="background:#a3302f"></i><i style="background:#a3302f"></i><i style="background:#c08a1e"></i><i style="background:#c08a1e"></i><i style="background:#c08a1e"></i><i style="background:#c08a1e"></i><i style="background:#2f6f6a"></i><i style="background:#2f6f6a"></i><i style="background:#2f6f6a"></i><i style="background:#3b4b82"></i></div>
    <div class="foot"><span><i>Spend and be spent.</i> 2 Cor 12:15</span><b>Begin Unit 1 →</b></div>
  </body>
</html>
